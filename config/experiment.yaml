# Single source of truth for every experimental constant.
# The brief's Experimental Constraint clause requires model, dataset, hardware, and
# inference settings to stay consistent across configurations. Centralising them here
# means a constant cannot silently drift between the notebook and a module.

seed: 42

dataset:
  name: scifact
  hf_id: BeIR/scifact          # BEIR SciFact via HuggingFace
  split: test
  cache_dir: data/raw
  processed_dir: data/processed

preprocessing:
  unicode_form: NFKC
  min_doc_tokens: 3            # docs shorter than this are logged, not silently dropped
  drop_empty_text: false       # keep title-only docs; policy stated in the report
  abbrev_regex: '\b[A-Z]{2,6}\b'

retrieval:
  bm25:
    k1: 1.2
    b: 0.75
    epsilon: 0.25              # rank_bm25 BM25Okapi floor, matched for parity testing
  dense:
    model: sentence-transformers/all-MiniLM-L6-v2
    batch_size: 64
    normalize: true
  hybrid:
    method: rrf
    rrf_k: 60                  # Cormack et al. (2009)
  top_k_default: 20
  candidate_pool_sizes: [5, 10, 20, 50]
  recall_ceiling_ks: [5, 10, 20, 50, 100]

rerank:
  models:
    primary: cross-encoder/ms-marco-MiniLM-L-6-v2
    comparison: ncbi/MedCPT-Cross-Encoder
    comparison_fallback: cross-encoder/ms-marco-MiniLM-L-12-v2
  batch_size: 16
  max_length: 512
  truncation: longest_first    # head truncation; kept fixed across all configs
  device: auto                 # auto -> mps if available, else cpu

evaluation:
  cutoff: 5                    # P@5, R@5, nDCG@5 as mandated
  metrics: [precision, recall, mrr, ndcg]
  min_queries: 10              # the brief's floor; we run all 300
  bootstrap_samples: 10000
  confidence_level: 0.95

timing:
  warmup_runs: 3
  timed_repeats: 5
  report_percentiles: [50, 95]  # median and p95; mean is skewed by model load

output:
  tables_dir: results/tables
  figures_dir: results/figures
  logs_dir: results/logs
  max_display_rows: 10          # keep the notebook PDF inside the page budget
